          - generic [ref=f2e249]:
            - heading "Atatürk - Makam Odası Deri Çerçeveli Tablo" [level=2] [ref=f2e250]
            - paragraph [ref=f2e251]: Türkiye Cumhuriyeti'nin kurucusu Mustafa Kemal Atatürk'ü anmak ve ona olan saygımızı ifade etmek için tasarlanmış olan bu özel makam odası tablosu, liderliğin ve tarihin simgesi olarak her mekana değer katar. Canvasia'nın ustalıkla ürettiği bu eser, kaliteli malzemeler ve üstün işçilikle bezenmiştir.
            - heading "Ürün Özellikleri" [level=3] [ref=f2e252]
            - paragraph [ref=f2e253]:
              - strong [ref=f2e254]: "Farklı Boyutlar:"
              - text: Bu tablo, farklı mekan ihtiyaçlarına uygun olarak 100x55 cm, 150x70 cm ve 200x100 cm olmak üzere üç farklı boyutta sunulmaktadır. Her boyut, ofisler, belediye binaları, okullar ve diğer resmi mekanlar için idealdir.
            - paragraph [ref=f2e255]:
              - strong [ref=f2e256]: "Yüksek Kaliteli Dijital Baskı:"
              - text: Atatürk'ün etkileyici portresi, yazı yazarken en modern dijital baskı teknolojisi kullanılarak detaylı bir şekilde işlenmiştir. Bu sayede, tablo uzun yıllar boyunca orijinal renklerini ve canlılığını koruyacak şekilde üretilmiştir.
            - paragraph [ref=f2e257]:
              - strong [ref=f2e258]: "Siyah Deri Çerçeve:"
              - text: Şıklığı ve resmiyeti simgeleyen siyah deri çerçeve, tablonun görünümünü zenginleştirir ve her türlü dekorasyona asil bir uyum sağlar.
            - paragraph [ref=f2e259]:
              - strong [ref=f2e260]: "Kolay Montaj:"
              - text: Tablo, duvara montaj için gerekli olan askı şablonu, askı aparatı, dübel ve vidalar ile birlikte gönderilmektedir. Bu aksesuarlar sayesinde montaj işlemi basit ve hızlıdır.
            - paragraph [ref=f2e261]:
              - strong [ref=f2e262]: "Güçlü ve Sağlam Paketleme:"
              - text: Tablonuz, özel tasarlanmış koruyucu bir paket içinde gönderilir. Bu paketleme, tablonun taşınma ve teslimat sürecinde herhangi bir zarar görmemesini garantiler.
            - paragraph [ref=f2e263]:
              - strong [ref=f2e264]: "Ücretsiz Kargo ve Hızlı Üretim:"
              - text: Siparişiniz Canvasia tarafından hızla işleme alınır ve ücretsiz kargo seçeneği ile en kısa sürede size ulaştırılır. Bu hizmet, alışveriş deneyiminizi daha da memnuniyet verici hale getirir.
            - paragraph [ref=f2e265]:
              - strong [ref=f2e266]: "%100 Müşteri Memnuniyeti:"
              - text: Canvasia, müşteri memnuniyetini en ön planda tutar ve satın alma işleminizden itibaren size en iyi hizmeti sunmayı taahhüt eder.
            - heading "Neden Atatürk - Makam Odası Deri Çerçeveli Tabloyu Seçmelisiniz?" [level=3] [ref=f2e267]
            - paragraph [ref=f2e268]: Atatürk'ün vizyonunu ve Türkiye Cumhuriyeti'nin temellerini her gün hatırlamak ve bu büyük liderin mirasını yaşatmak için bu tablo mükemmel bir seçimdir. Resmi ve özel mekanlarınızda, Atatürk'ün ilham verici liderliğini ve tarihi önemini vurgulayan bu tablo, ziyaretçilerinizi etkileyecek ve onlara ilham verecektir.
            - paragraph [ref=f2e269]: Şimdi sipariş vererek, Atatürk - Makam Odası Deri Çerçeveli Tabloyu ofisinize veya kurumunuza taşıyın ve bu tarihi anı ölümsüzleştirin!
            - heading [level=4] [ref=f2e270]:
              - strong [ref=f2e271]: "\"Herkes ulusal görevini ve sorumluluğunu bilmeli, memleket meseleleri üzerinde o düşünceyle, düşünüp çalışmayı görev edinmelidir.\""
